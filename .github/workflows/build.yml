name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: |
          unzip -q chatgameai-mod.zip
          cd chatgameai-mod
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chatgameai-jar
          path: chatgameai-mod/build/libs/chatgameai-1.0.0.jar
